[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sku-forecasting"
version = "0.1.0"
description = "SKU-level demand forecasting with automated model selection: AutoETS, Croston/SBA for intermittency, seasonal naive and trend baselines, selected per SKU by rolling-origin backtests"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Swetha Bethireddy" }]
keywords = ["forecasting", "demand-planning", "ets", "croston", "intermittent-demand", "backtesting"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: portfolio-level end-to-end tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["SIM108"]

[tool.ruff.lint.per-file-ignores]
"src/*" = ["N803", "N806"]
"tests/*" = ["N803", "N806"]
"scripts/*" = ["N803", "N806"]

[tool.coverage.run]
source = ["src/forecasting"]

[tool.mypy]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
