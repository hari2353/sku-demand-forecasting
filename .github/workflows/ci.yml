name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint (ruff)
        run: ruff check src tests scripts
      - name: Type check (mypy)
        run: mypy src/forecasting
      - name: Run tests with coverage
        run: pytest --cov=forecasting --cov-report=term-missing
      - name: Portfolio forecasting run (selection + backtests)
        run: |
          mkdir -p artifacts
          python scripts/run_forecast.py --out artifacts | tee artifacts/forecast.log
          python scripts/verify_forecast.py
