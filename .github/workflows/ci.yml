name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint (ruff)
        run: ruff check src tests scripts
      - name: Type check (mypy)
        run: mypy src/forecasting
      - name: Run tests with coverage
        run: pytest --cov=forecasting --cov-report=term-missing
      - name: Portfolio forecasting run (selection + backtests)
        run: |
          python scripts/run_forecast.py --out artifacts | tee artifacts/forecast.log
          python -c "
          import json
          from pathlib import Path
          summary = json.loads(Path('artifacts/portfolio_summary.json').read_text())
          assert len(summary['per_sku']) > 0, 'no SKUs selected'
          assert all(s['selected_model'] for s in summary['per_sku'].values())
          assert summary['overall']['smape'] > 0, 'invalid overall sMAPE'
          print('portfolio forecast check passed for', len(summary['per_sku']), 'SKUs')
          "
